<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOVIE TRACKER</title>
    <link rel="stylesheet" href="styles.css?v=3.0">

   
</head>
<body>
    <!-- Auth Screen -->
    <div id="authScreen" class="auth-container">
        <div class="auth-card">
            <h2>🍿 Welcome Back</h2>
            <p id="noProfilesMsg" style="display: none; color: #64748b;">No profiles found. Please create one.</p>
            
            <div id="loginFormContainer" class="form-group">
                <label for="loginUserSelect">Select Profile</label>
                <select id="loginUserSelect"></select>
                <input type="password" id="loginPinInput" placeholder="4-Digit PIN" maxlength="4">
                
                <div class="auth-actions">
                    <button class="btn-primary" onclick="login()">Login</button>
                    <button class="btn-delete" onclick="handleDeleteProfile()">Delete Profile</button>
                </div>
            </div>

            <hr class="divider">

            <div class="auth-footer">
                <button class="btn-secondary" onclick="openModal('registerModal')">+ Create New Profile</button>
                <button class="btn-danger-link" onclick="handleClearAllProfiles()">Reset All Data</button>
            </div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" style="display: none;">
        <!-- Header Nav -->
        <header class="top-nav">
            <div class="user-info">
                <span id="activeUserLabel">User: </span>
                <button class="btn-secondary" onclick="handleChangePinModal()"> Change PIN</button>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </header>

        <main class="container">
            <h1 id="welcomeTitle">🎬 Watchlist</h1>
            <p class="subtitle">Track movies & TV shows, check ratings, and monitor watch progress.</p>

            <!-- Progress Bar -->
            <div class="progress-section">
                <div class="progress-info">
                    <span>Watch Progress</span>
                    <span id="progressText">0 / 0 Completed (0%)</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progressBar" class="progress-bar-fill"></div>
                </div>
            </div>

            <!-- Search & Filter Controls -->
            <div class="controls-card">
                <div class="search-box">
                    <input type="text" id="movieInput" placeholder="Movie or TV Show Title..." onkeypress="handleKeyPress(event)">
                    <input type="number" id="yearInput" placeholder="Year (Opt.)" onkeypress="handleKeyPress(event)">
                    <select id="typeInput">
                        <option value="">All Types</option>
                        <option value="movie">Movie</option>
                        <option value="series">Series</option>
                    </select>
                    <select id="addPlaylistSelect"></select>
                    <button class="btn-primary" onclick="addMovie()">Search & Add</button>
                </div>

                <div class="filter-box">
                    <label>Filter View:</label>
                    <select id="playlistFilterSelect" onchange="handleFilterChange()"></select>
                    <button class="btn-secondary" onclick="createPlaylist()">+ New Playlist</button>
                </div>
            </div>

            <!-- Dynamic Movies Grid -->
            <div id="movieGrid" class="movie-grid"></div>
        </main>
    </div>

    <!-- Register Profile Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content glass-card">
            <h3>Create Profile</h3>
            <input type="text" id="regNameInput" placeholder="Profile Name">
            <input type="password" id="regPinInput" placeholder="4-Digit PIN" maxlength="4">
            <div class="modal-actions">
                <button class="btn-primary" onclick="registerUser()">Save Profile</button>
                <button class="btn-secondary" onclick="closeModal('registerModal')">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Custom Center Modal (Custom UI Prompt Replacement) -->
    <div id="customModal" class="modal">
        <div class="modal-content glass-card glowing-modal">
            <h3 id="customModalTitle">PIN Security</h3>
            <p id="customModalDesc" class="modal-desc"></p>
            <input type="password" id="customModalInput" placeholder="Enter PIN..." maxlength="20">
            <div class="modal-actions">
                <button id="customModalCancelBtn" class="btn-secondary" onclick="closeCustomModal(false)">Cancel</button>
                <button id="customModalConfirmBtn" class="btn-primary" onclick="closeCustomModal(true)">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Movie Details Modal -->
    <div id="aboutModal" class="modal">
        <div class="modal-content modal-large glass-card">
            <div class="modal-body">
                <img id="modalPoster" src="" alt="Poster">
                <div class="modal-info">
                    <h2 id="modalTitle"></h2>
                    <p id="modalYear" class="modal-meta"></p>
                    <p id="modalGenre" class="modal-meta"></p>
                    <p id="modalRating" class="modal-rating"></p>
                    <p id="modalPlot" class="modal-plot"></p>
                    <button class="btn-secondary" onclick="closeModal('aboutModal')">Close</button>
                </div>
            </div>
        </div>
    </div>

   <script src="script.js?v=1.1"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</body>
</html>
