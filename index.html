<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlist & Movie Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <!-- Header Nav -->
        <header class="top-nav">
            <div class="user-info">
                <span id="user-display-name">Welcome, User</span>
                <button class="btn-primary" id="open-add-modal-btn">+ Add Movie</button>
                <button class="btn-logout" id="logout-btn">Logout</button>
            </div>
        </header>

        <p class="subtitle">Track your watched movies and manage your custom playlists.</p>

        <!-- Feature 5: Stats & Analytics Dashboard -->
        <div class="stats-dashboard">
            <div class="stat-card">
                <span class="stat-label">Total Movies</span>
                <span class="stat-value" id="stat-total">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Watched</span>
                <span class="stat-value" id="stat-watched">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Pending</span>
                <span class="stat-value" id="stat-pending">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Avg. Rating</span>
                <span class="stat-value" id="stat-avg-rating">0.0</span>
            </div>
        </div>

        <!-- Progress Section -->
        <section class="progress-section">
            <div class="progress-info">
                <span>Watchlist Completion</span>
                <span id="progress-percentage">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
            </div>
        </section>

        <!-- Controls Section -->
        <section class="controls-card">
            <!-- Search Controls -->
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search by movie title...">
                <input type="number" id="rating-input" placeholder="Min IMDb Rating" min="0" max="10" step="0.1">
                <button class="btn-secondary" id="reset-filters-btn">Reset</button>
            </div>

            <!-- Filter & Feature 4: Sort Controls -->
            <div class="filter-sort-wrapper">
                <div class="filter-box">
                    <select id="filter-status">
                        <option value="all">All Statuses</option>
                        <option value="watched">Watched Only</option>
                        <option value="unwatched">Unwatched Only</option>
                    </select>
                    <select id="filter-playlist">
                        <option value="all">All Playlists</option>
                        <option value="Favorites">Favorites</option>
                        <option value="Watch Later">Watch Later</option>
                        <option value="Classics">Classics</option>
                    </select>
                </div>

                <div class="sort-box">
                    <select id="sort-by">
                        <option value="default">Sort By: Default</option>
                        <option value="rating-desc">IMDb Rating: High to Low</option>
                        <option value="rating-asc">IMDb Rating: Low to High</option>
                        <option value="title-asc">Title: A to Z</option>
                        <option value="date-newest">Release Date: Newest First</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Movie Grid Section -->
        <div class="section-title-container">
            <h2 class="section-title">Your Collection</h2>
        </div>
        
        <div class="movie-grid" id="movie-grid">
            <!-- Movie cards injected dynamically -->
        </div>
    </div>

    <!-- Add Movie Modal -->
    <div class="modal" id="add-modal">
        <div class="modal-content">
            <h2 style="color: #e50914; margin-bottom: 8px;">Add New Movie</h2>
            <form id="add-movie-form">
                <div class="form-group">
                    <label for="movie-title-input">Movie Title</label>
                    <input type="text" id="movie-title-input" required placeholder="e.g. Inception">
                </div>
                <div class="form-group">
                    <label for="movie-rating-input">IMDb Rating</label>
                    <input type="number" id="movie-rating-input" min="0" max="10" step="0.1" required placeholder="e.g. 8.8">
                </div>
                <div class="form-group">
                    <label for="movie-poster-input">Poster Image URL</label>
                    <input type="url" id="movie-poster-input" required placeholder="https://example.com/poster.jpg">
                </div>
                <div class="form-group">
                    <label for="movie-date-input">Release Date</label>
                    <input type="date" id="movie-date-input" required>
                </div>
                <div class="form-group">
                    <label for="movie-playlist-input">Playlist Category</label>
                    <select id="movie-playlist-input">
                        <option value="Watch Later">Watch Later</option>
                        <option value="Favorites">Favorites</option>
                        <option value="Classics">Classics</option>
                    </select>
                </div>
                <div class="auth-actions" style="margin-top: 16px;">
                    <button type="submit" class="btn-primary">Save Movie</button>
                    <button type="button" class="btn-secondary" id="close-add-modal-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
