<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOVIE TRACKER</title>.
    <link rel="stylesheet" href="styles.css">
</head>
<body>
 <!-- Authentication Screen (Shown when not logged in) -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-card">
            <h2>🔒 Select Profile to Login</h2>
            
            <div id="loginFormContainer">
                <div class="form-group center-group">
                    <label for="loginUserSelect">Profile Name:</label>
                    <select id="loginUserSelect"></select>
                </div>
                <div class="form-group center-group">
                    <label for="loginPinInput">Enter 4-Digit PIN:</label>
                    <input type="password" id="loginPinInput" maxlength="4" placeholder="****">
                </div>
                <button class="btn-primary" onclick="login()">Login</button>
            </div>

            <!-- Message shown when no profiles exist yet -->
            <p id="noProfilesMsg" style="display: none; color: #94a3b8; margin: 15px 0;">No profiles created yet. Click below to create one!</p>

            <hr class="divider">
            <button class="btn-secondary" onclick="openModal('registerModal')">Create New Profile</button>
        </div>
    </div>

    <!-- Main Dashboard (Shown after logging in) -->
    <div id="dashboard" class="container" style="display: none;">
        
        <!-- Header Bar -->
        <div class="user-bar">
            <div class="user-profile-info">
                <span id="activeUserLabel">Logged in as: <strong>Guest</strong></span>
            </div>
            <button class="btn-danger" onclick="logout()">Logout</button>
        </div>

        <!-- Title Section -->
        <header class="header">
            <h1 id="welcomeTitle">🎬 Watchlist Tracker</h1>
            <p>Track movies & TV shows, check ratings, and monitor watch progress.</p>
        </header>

        <!-- Search Bar with Type & Year Filters -->
        <div class="search-bar">
            <input type="text" id="movieInput" placeholder="Enter title (e.g. The Family Man, Inception)..." onkeydown="handleKeyPress(event)">
            <input type="number" id="yearInput" placeholder="Year (Opt.)" style="max-width: 110px;">
            <select id="typeInput" style="max-width: 130px;">
                <option value="">All Types</option>
                <option value="movie">Movie</option>
                <option value="series">TV Series</option>
            </select>
            <button onclick="addMovie()">Search & Add</button>
        </div>

        <!-- Progress Tracker Bar -->
        <div class="stats-card">
            <div class="stats-info">
                <span>Watch Progress</span>
                <span id="progressText">0 / 0 Completed</span>
            </div>
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <!-- Movie Grid -->
        <div id="movieGrid" class="movie-grid"></div>
    </div>

    <!-- About Modal Popup -->
    <div id="aboutModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('aboutModal')">&times;</span>
            <div class="modal-body">
                <img id="modalPoster" src="" alt="Poster">
                <div class="modal-details">
                    <h2 id="modalTitle"></h2>
                    <div class="modal-meta">
                        <span id="modalYear"></span>
                        <span id="modalGenre"></span>
                        <span id="modalRating" class="badge"></span>
                    </div>
                    <p id="modalPlot"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Register Profile Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content form-modal">
            <span class="close-btn" onclick="closeModal('registerModal')">&times;</span>
            <h2>Create New Profile</h2>
            <div class="form-group center-group">
                <label for="regNameInput">Profile Name:</label>
                <input type="text" id="regNameInput" placeholder="YOUR NAME">
            </div>
            <div class="form-group center-group">
                <label for="regPinInput">4-Digit PIN:</label>
                <input type="password" id="regPinInput" maxlength="4" placeholder="Set 4-Digit PIN">
            </div>
            <button class="btn-primary" onclick="registerUser()">Create Profile</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
</body>
</html>
